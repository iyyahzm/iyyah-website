<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Iyyah Zareef-Mustafa</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="brand">
      <div class="logo">
        <img src="assets/logo.png" alt="Iyyah Logo">
      </div>
      <span class="brand-name">Iyyah Zareef-Mustafa</span>
    </a>
    <div class="topbar-center">
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <span class="nav-separator">|</span>
        <a href="index.html#projects" class="nav-link">Projects</a>
        <span class="nav-separator">|</span>
        <a href="index.html#skills" class="nav-link">Skills</a>
        <span class="nav-separator">|</span>
        <a href="resume.html" class="nav-link">Resume</a>
        <span class="nav-separator">|</span>
        <a href="index.html#about" class="nav-link">About</a>
        <span class="nav-separator">|</span>
        <a href="index.html#leadership" class="nav-link">Leadership</a>
        <span class="nav-separator">|</span>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input type="text" placeholder="Search">
      </div>
    </div>
  </header>

  <section class="content-section" style="padding-top: 100px;">
    <h2 class="section-title">Resume</h2>
    <div style="text-align:center; margin-bottom: 24px;">
      <a href="assets/IyyahZareef-Mustafa_Resume.pdf"
         class="btn btn-primary"
         id="download-resume-btn">
        Download PDF
      </a>
    </div>

    <div style="max-width:900px; margin:0 auto;">
      <canvas id="pdf-canvas" style="width:100%; display:block; border-radius:16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);"></canvas>
    </div>

    <p style="text-align:center; margin-top:16px; opacity:0.6; font-size:14px;">
      Having trouble viewing the resume above?
      <a href="assets/IyyahZareef-Mustafa_Resume.pdf" target="_blank">Open it directly</a>.
    </p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = 'assets/IyyahZareef-Mustafa_Resume.pdf';

    pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
      pdf.getPage(1).then(function(page) {
        const scale = 2;
        const viewport = page.getViewport({ scale: scale });
        const canvas = document.getElementById('pdf-canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        page.render({
          canvasContext: context,
          viewport: viewport
        });
      });
    });

    document.getElementById('download-resume-btn').addEventListener('click', function(e) {
      e.preventDefault();
      fetch('assets/IyyahZareef-Mustafa_Resume.pdf')
        .then(response => response.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'IyyahZareef-Mustafa_Resume.pdf';
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        });
    });
  </script>

</body>
</html>
